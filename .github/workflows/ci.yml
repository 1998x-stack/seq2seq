name: python-ci

on:
  push:
    branches: [main, ablation, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test offline
        run: pytest -q
      - name: Import CLI
        run: seq2seq --help
      - name: Generate offline toy dashboard
        run: |
          seq2seq experiments run -c configs/smoke.yaml \
            --output runs/ci-ablation --seeds 42 --split-seed 2026 \
            --max-examples 4 --limit 1 --dashboard
          test -s runs/ci-ablation/dashboard.html
          grep -q 'Seq2Seq' runs/ci-ablation/dashboard.html
      - uses: actions/upload-artifact@v4
        with:
          name: seq2seq-offline-smoke-dashboard
          path: |
            runs/ci-ablation/dashboard.html
            runs/ci-ablation/**/metrics.csv
            runs/ci-ablation/**/events.jsonl
          retention-days: 7
