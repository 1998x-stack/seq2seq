# Plain RNN without attention: fixed-state historical baseline
seed: 42
dataset:
  backend: huggingface
  split_seed: 42
  split_strategy: random
  name: Helsinki-NLP/opus_books
  subset: en-fr
  split: train
  revision: 1f9f619
  source_lang: en
  target_lang: fr
  max_samples: 30000
  min_length: 1
  max_length: 40
  validation_fraction: 0.05
  test_fraction: 0.05
tokenizer:
  lowercase: true
  vocab_size: 12000
  min_freq: 2
model:
  cell: rnn
  embedding_dim: 256
  hidden_dim: 384
  num_layers: 2
  dropout: 0.2
  attention: false
  reverse_source: true
training:
  device: auto
  epochs: 12
  batch_size: 64
  num_workers: 0
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  teacher_forcing: 1.0
  label_smoothing: 0.0
  max_new_tokens: 50

logging:
  enabled: true
  log_every_steps: 20
  tensorboard: false
